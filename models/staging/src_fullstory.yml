version: 2

models:
  - name: stg_fullstory__events

    deprecation_date: 2026-01-21

    description: |
      **Staging model for Fullstory Events**
      
      This model performs initial transformations on raw Fullstory event data:
      - Type casting and data validation
      - JSON parsing for source_properties and event_properties
      - Basic field extraction and standardization

    meta:
      contains_pii: true
        
    columns:
      - name: event_id
        description: "Unique identifier for each event"
        data_type: string
        tests:
          - not_null
          
      - name: device_id
        description: "Unique identifier for the user's device"
        data_type: string
          
      - name: session_id
        description: "Unique identifier for the user session"
        data_type: string
          
      - name: full_session_id
        description: "Composite key: device_id:session_id for unique session identification"
        data_type: string

      - name: event_time
        description: "Timestamp when the event occurred (user's local time)"
        data_type: datetime

      - name: event_type
        description: "Type of event (click, navigate, custom, etc.)"
        data_type: string

      - name: source_type
        description: "Platform where event occurred (web, mobile_app)"
        data_type: string
              
      - name: updated_time
        description: "When this event record was last updated (coalesced with processed_time)"
        data_type: datetime
          
      - name: processed_time
        description: "When this event was processed by Fullstory systems"
        data_type: datetime
          
      - name: user_id
        description: "Identified user ID if user is logged in"
        data_type: string
        
      - name: device_user_agent
        description: "User agent string from the device/browser"
        data_type: string
        
      - name: device_type
        description: "Type of device (desktop, mobile, tablet)"
        data_type: string
        
      - name: device_operating_system
        description: "Operating system of the device"
        data_type: string
        
      - name: device_browser
        description: "Browser name"
        data_type: string
        
      - name: device_browser_version
        description: "Browser version"
        data_type: string
        
      - name: source_properties
        description: "Raw JSON containing all source metadata"
        data_type: json
        
      - name: event_properties
        description: "Raw JSON containing all event-specific data"
        data_type: json
