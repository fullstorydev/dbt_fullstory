name: "dbt_fullstory"
version: "0.11.0"
config-version: 2
require-dbt-version: [">=1.6.0", "<2.0.0"]

# This setting configures which "profile" dbt uses for this project.
profile: "dbt_fullstory"

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets: # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models
models:
  dbt_fullstory:
    +materialized: view
    +incremental_strategy: merge
    +on_schema_change: fail
    
    # Performance optimizations
    +persist_docs:
      columns: true
      relation: true
      
    # Staging layer - fast, minimal processing
    staging:
      +materialized: view
      +tags: ['staging']
      stg_fullstory__events:
        +materialized: view
        
    # Intermediate layer - ephemeral for performance
    intermediate:
      +materialized: ephemeral  
      +tags: ['intermediate']
      
    # Mart layer - materialized appropriately
    sessions:
      +materialized: incremental
      +unique_key: full_session_id
      +incremental_strategy: merge
      +tags: ['mart', 'incremental']
      
    events:
      # +materialized: incremental  # Consider changing from view if large
      +unique_key: event_id
      +incremental_strategy: merge  
      +tags: ['mart', 'incremental']

# Test configurations based on variables
tests:
  dbt_fullstory:
    +enabled: "{{ var('fullstory_enable_data_tests', false) }}"
    +store_failures: "{{ var('fullstory_test_store_failures', false) }}"
    +warn_if: ">= 1"
    +error_if: ">= 100"


vars:
  # Data quality
  fullstory_enable_safe_json_parsing: true
  
  # Testing
  fullstory_enable_data_tests: false
  fullstory_test_store_failures: false

# Project-level configurations

  dbt_date:time_zone: Etc/UTC
  fullstory_incremental_interval_hours: 192 # 8 days
  fullstory_replay_host: app.fullstory.com

  # For filtering all event data, if necessary
  fullstory_min_event_time: "1900-01-01 00:00:00" # Inclusive

  fullstory_events_types:
    [
      "background",
      "change",
      "click",
      "consent",
      "console_message",
      "copy",
      "crash",
      "cumulative_layout_shift",
      "custom",
      "element_seen",
      "exception",
      "first_input_delay",
      "form_abandon",
      "highlight",
      "identify",
      "keyboard_close",
      "keyboard_open",
      "load",
      "low_memory",
      "mouse_thrash",
      "navigate",
      "page_properties",
      "paste",
      "pinch_gesture",
      "request",
    ]
